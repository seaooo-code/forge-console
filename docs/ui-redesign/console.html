<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>线上现状 · RN Bundle 平台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/misans@4.1.0/lib/Normal/MiSans-Regular.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/misans@4.1.0/lib/Normal/MiSans-Medium.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/misans@4.1.0/lib/Normal/MiSans-Semibold.min.css" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --mi:"MiSans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
  --shell:#f4f4f5;--canvas:#fff;--card:#fff;--hover:#f6f6f7;--track:#f1f1f3;--navhover:rgba(24,24,27,.045);
  --ring:rgba(24,24,27,.075);--ring2:rgba(24,24,27,.12);
  --edge:0 0 0 1px var(--ring),0 1px 2px rgba(24,24,27,.04);
  --raise:0 0 0 1px var(--ring),0 1px 2px rgba(24,24,27,.05),0 10px 28px -16px rgba(24,24,27,.28);
  --ink:#18181b;--dim:#5f5f66;--faint:#9a9aa1;
  --acc:#0e6b55;--accsoft:#e6f3ee;--accwash:#f4faf7;--acctx:#0b5a47;--onacc:#fff;
  --gry:#b45309;--grysoft:#fbf0dd;--pin:#7c3aed;--pinsoft:#f2ebfd;
  --ok:#15803d;--err:#dc2626;--errsoft:#fdecec;--run:#2563eb;--runsoft:#e8effd;
  --e-test:#0ea5e9;--e-stg:#d97706;--e-prod:#e11d48;
  --toast-bg:#18181b;--toast-ink:#fff;
}
[data-theme=dark]{
  --shell:#000;--canvas:#0f0f11;--card:#151518;--hover:#1b1b1f;--track:#1d1d21;--navhover:rgba(255,255,255,.05);
  --ring:rgba(255,255,255,.075);--ring2:rgba(255,255,255,.14);
  --edge:0 0 0 1px var(--ring);
  --raise:0 0 0 1px var(--ring2),0 16px 36px -18px rgba(0,0,0,.9);
  --ink:#ededef;--dim:#a1a1a8;--faint:#6c6c73;
  --acc:#34c79a;--accsoft:#0d2a21;--accwash:#0b1814;--acctx:#74e2be;--onacc:#03140e;
  --gry:#f0b252;--grysoft:#2e220e;--pin:#b794f6;--pinsoft:#22193a;
  --ok:#4ade80;--err:#f87171;--errsoft:#2f1414;--run:#60a5fa;--runsoft:#0f1f3a;
  --e-test:#38bdf8;--e-stg:#fbbf24;--e-prod:#fb7185;
  --toast-bg:#ededef;--toast-ink:#000;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--shell);color:var(--ink);font-family:var(--mi);font-weight:330;font-size:14px;-webkit-font-smoothing:antialiased;transition:background-color .2s,color .2s}
b,strong{font-weight:520}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input{border:0}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- 外框：灰色底上放导航，内容放进白色画布 ---------- */
.app{display:grid;grid-template-columns:228px minmax(740px,1fr) 404px;gap:8px;height:100vh;min-width:1388px;padding:8px 8px 8px 0}
.canvas{background:var(--canvas);border-radius:14px;box-shadow:var(--edge);min-height:0}

/* ---------- 导航 ---------- */
.side{display:flex;flex-direction:column;padding:10px 10px 6px 12px;min-height:0}
.logo{display:flex;align-items:center;gap:9px;font-weight:630;font-size:15px;padding:6px 8px 14px}
.logo-mark{width:22px;height:22px;border-radius:7px;background:var(--acc);display:grid;place-items:center;color:var(--onacc);font-size:10.5px;font-weight:630;letter-spacing:.02em}
.app-sw{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:var(--canvas);box-shadow:var(--edge);border-radius:10px;padding:7px 9px;margin-bottom:16px}
.app-av{width:24px;height:24px;border-radius:7px;background:var(--ink);color:var(--canvas);display:grid;place-items:center;font-size:11.5px;font-weight:520;flex:none}
.app-n{font-size:13px;font-weight:520;line-height:1.2}
.app-k{display:block;font-size:11px;color:var(--faint);font-weight:330}
.app-sw .ic{margin-left:auto;color:var(--faint);width:14px;height:14px}
.nav-g{font-size:11.5px;color:var(--faint);padding:16px 10px 6px}
.nav-a{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:9px;color:var(--dim);font-size:13.5px;text-decoration:none;margin-bottom:1px}
.nav-a .ic{color:var(--faint)}
.nav-a:hover{background:var(--navhover);color:var(--ink)}
.nav-a:hover .ic{color:var(--dim)}
.nav-a.on{background:var(--canvas);box-shadow:var(--edge);color:var(--ink);font-weight:520}
.nav-a.on .ic{color:var(--acc)}
.nav-n{margin-left:auto;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums;font-weight:330}
.side-ft{margin-top:auto;display:flex;align-items:center;gap:8px;padding:8px 4px 4px}
.av{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--canvas);display:grid;place-items:center;font-size:12px;font-weight:520;flex:none}
.me{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--dim);min-width:0;flex:1}
.me-n{color:var(--ink);font-weight:520;display:block;line-height:1.25}
.me-r{font-size:11px;color:var(--faint)}
.theme{display:inline-flex;background:var(--track);border-radius:9px;padding:2px;gap:1px}
.th-b{width:26px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--faint)}
.th-b:hover{color:var(--ink)}
.th-b[aria-pressed=true]{background:var(--canvas);color:var(--ink);box-shadow:var(--edge)}
.th-b .ic{width:14px;height:14px}

/* ---------- 通用控件 ---------- */
.seg{display:inline-flex;background:var(--track);border-radius:9px;padding:2px;gap:1px}
.seg-b{border-radius:7px;padding:4px 11px;font-size:12.5px;color:var(--dim)}
.seg-b:hover{color:var(--ink)}
.seg-b[aria-pressed=true]{background:var(--canvas);color:var(--ink);box-shadow:var(--edge)}
.seg-b:disabled{opacity:.4}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--card);box-shadow:var(--edge);border-radius:9px;padding:6px 12px;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--acc);color:var(--onacc);font-weight:520;box-shadow:none}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
.btn.ghost{box-shadow:none;background:transparent;color:var(--dim)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn:disabled{opacity:.45}
.btn .ic{width:14px;height:14px}
.tag{font-size:11.5px;padding:1px 7px;border-radius:6px;white-space:nowrap}
.tag.f{background:var(--accsoft);color:var(--acctx)}
.tag.g{background:var(--grysoft);color:var(--gry)}
.tag.p{background:var(--pinsoft);color:var(--pin)}
.tag.run{background:var(--runsoft);color:var(--run)}
.tag.err{background:var(--errsoft);color:var(--err)}
.tag.n{background:var(--track);color:var(--dim)}
.dot{width:8px;height:8px;border-radius:3px;flex:none;display:inline-block}

/* ---------- 主区 ---------- */
.main{padding:22px 26px 26px;overflow-y:auto;min-width:0}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:18px}
.ttl{font-size:24px;font-weight:630;letter-spacing:-.02em;margin:0}
.sub{margin:6px 0 0;color:var(--dim);font-size:13px}
.tools{display:flex;align-items:center;gap:8px;flex:none}
.tool-l{font-size:12.5px;color:var(--faint);margin-right:2px}
.search{display:inline-flex;align-items:center;gap:7px;background:var(--card);box-shadow:var(--edge);border-radius:9px;padding:6px 8px 6px 10px;font-size:13px;color:var(--faint)}
.kbd{font-size:11px;color:var(--dim);background:var(--track);border-radius:5px;padding:0 5px;margin-left:12px}

/* 需要处理 */
.need{margin-top:22px}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:0 0 10px}
.sec-t{font-size:13.5px;font-weight:520;margin:0}
.sec-s{font-size:12px;color:var(--faint)}
.need-l{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.need-c{background:var(--card);box-shadow:var(--edge);border-radius:14px;padding:13px 14px 12px;display:flex;flex-direction:column;gap:11px;min-height:112px}
.need-top{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%}
.need-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.need-ic .ic{width:15px;height:15px}
.need-ic.err{background:var(--errsoft);color:var(--err)}
.need-ic.gry{background:var(--pinsoft);color:var(--pin)}
.need-ic.plat{background:var(--track);color:var(--dim)}
.need-t{font-size:13.5px;line-height:1.45}
.need-m{font-size:12px;color:var(--faint);margin-top:3px;line-height:1.5}
.need-a{display:flex;gap:6px;margin-top:auto;padding-left:41px}
.need-empty{background:var(--card);box-shadow:var(--edge);border-radius:14px;padding:16px;color:var(--dim);font-size:13px}

/* 矩阵：每个模块一张白卡，格子平时透明 */
.mx{margin-top:26px}
.cols{display:grid;grid-template-columns:176px repeat(3,minmax(0,1fr));gap:4px}
.mx-h{padding:0 6px 8px}
.gh{padding:0 12px;font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:7px}
.gh:first-child{padding-left:10px}
.mrow{background:var(--card);box-shadow:var(--edge);border-radius:16px;padding:6px;margin-bottom:10px}
.mod{padding:10px 10px 8px}
.mod-n{font-size:13.5px;font-weight:520}
.mod-k{font-size:11px;padding:1px 6px;border-radius:5px;background:var(--track);color:var(--dim);margin-left:6px}
.mod-r{margin:5px 0 0;font-size:11.5px;color:var(--faint);font-family:var(--mono)}
.cell{border-radius:11px;padding:10px 12px 11px;text-align:left;display:flex;flex-direction:column;min-height:90px;width:100%;transition:background-color .12s,box-shadow .12s}
.cell:hover{background:var(--hover)}
.cell.sel{background:var(--accsoft);box-shadow:inset 0 0 0 1.5px var(--acc)}
.cell.empty{color:var(--faint);font-size:12.5px;justify-content:center;align-items:center}
.cell.empty.sel{color:var(--acctx)}
.cell.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{box-shadow:inset 0 0 0 1.5px var(--acc),0 0 0 6px var(--accsoft)}100%{box-shadow:inset 0 0 0 1.5px var(--acc),0 0 0 0 transparent}}
.lane{display:flex;align-items:baseline;gap:7px;font-size:12.5px;line-height:1.75;width:100%;min-width:0}
.lane-b{font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:520}
.lane-t{font-size:11.5px;color:var(--acctx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lane-t.g{color:var(--gry)}
.lane-t.p{color:var(--pin)}
.lane-a{margin-left:auto;font-size:11.5px;color:var(--faint);white-space:nowrap}
.split{display:flex;gap:2px;height:5px;margin:5px 0 3px;width:100%}
.split-i{display:block;border-radius:3px;background:var(--acc);transition:width .15s}
.split-i.g{background:var(--gry)}
.cell-ft{margin-top:auto;padding-top:6px;font-size:11.5px;display:flex;gap:10px;flex-wrap:wrap}
.new{color:var(--acctx);font-weight:520}
.running{color:var(--run)}
.running::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:5px;vertical-align:1px}
.legend{display:flex;gap:18px;font-size:12px;color:var(--dim);padding:6px 6px 0;align-items:center}
.lg-i{display:inline-block;width:14px;height:5px;border-radius:3px;margin-right:6px;vertical-align:2px}
.legend-r{margin-left:auto;color:var(--faint)}

/* ---------- 右侧面板 ---------- */
.insp{padding:22px 20px 20px;overflow-y:auto;scrollbar-width:thin}
.i-env{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:7px}
.i-ttl{margin:6px 0 3px;font-size:21px;font-weight:630;letter-spacing:-.01em}
.i-sub{margin:0 0 20px;font-size:12.5px;color:var(--faint)}
.i-h{font-size:12.5px;font-weight:520;color:var(--dim);margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;padding:0 2px}
.i-hs{font-weight:330;color:var(--faint);font-size:12px}
.i-sec{margin-bottom:22px}
.i-note{font-size:12px;color:var(--faint);line-height:1.6;margin:0 2px 10px}
.box{background:var(--card);box-shadow:var(--edge);border-radius:14px;padding:4px}
.i-split{display:flex;gap:2px;height:8px;margin:8px 10px 6px}
.rt{padding:9px 10px;border-radius:10px}
.rt-top{display:flex;align-items:center;gap:9px;font-size:13px}
.rt-ord{width:18px;height:18px;border-radius:50%;background:var(--track);color:var(--faint);font-size:11px;display:grid;place-items:center;flex:none}
.rt-b{font-weight:520;font-variant-numeric:tabular-nums}
.rt-m{font-size:11.5px;color:var(--faint);margin-left:auto;text-align:right;line-height:1.45}
.rt-act{display:flex;gap:6px;margin-top:8px;padding-left:27px}
.adj{margin-top:10px;padding-left:27px}
.adj-r{display:flex;align-items:center;gap:10px}
.adj input{flex:1;accent-color:var(--gry);background:transparent;margin:0}
.adj-v{font-size:15px;font-weight:630;min-width:44px;text-align:right}
.adj-n{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--faint)}
.cand{border-radius:10px;transition:background-color .12s}
.cand:hover{background:var(--hover)}
.cand.open,.cand.open:hover{background:var(--accwash);box-shadow:inset 0 0 0 1.5px var(--acc)}
.cand-r{display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:9px 10px;align-items:center}
.cand-a{display:flex;align-items:baseline;gap:8px;font-size:13.5px;flex-wrap:wrap}
.cand-b{font-weight:520;font-variant-numeric:tabular-nums}
.cand-d{font-size:11.5px;color:var(--faint)}
.cand-d.up{color:var(--acctx)}
.cand-d.down{color:var(--gry)}
.cand-m{font-size:11.5px;color:var(--faint);font-family:var(--mono)}
.cand-act{grid-row:1/3;grid-column:2;display:flex;gap:6px;align-items:center}
.cand-st{font-size:12px;color:var(--faint)}
.comp{padding:0 10px 12px;display:flex;flex-direction:column;gap:12px}
.cm-l{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.cm-i{display:grid;grid-template-columns:58px 1fr auto;gap:8px;align-items:baseline;padding:3px 0;font-size:12.5px}
.cm-i.rm{opacity:.7}
.cm-sha{font-family:var(--mono);font-size:11px;color:var(--faint)}
.cm-by{font-size:11px;color:var(--faint)}
.cm-more{font-size:12px;color:var(--faint);display:flex;justify-content:space-between;gap:10px}
.cm-link{color:var(--acctx);text-decoration:none;font-weight:520;white-space:nowrap}
.cm-link:hover{text-decoration:underline}
.c-row{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--dim);flex-wrap:wrap}
.c-lb{width:34px;color:var(--faint);flex:none}
.c-fld{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--dim);min-height:30px}
.c-fld input[type=range]{flex:1;accent-color:var(--acc);background:transparent;margin:0}
.c-v{font-size:17px;font-weight:630;color:var(--ink);min-width:44px;text-align:right}
.c-id{background:var(--card);box-shadow:var(--edge);border-radius:7px;padding:3px 9px;color:var(--ink);font-family:var(--mono);font-size:12px}
.c-day{background:var(--card);box-shadow:var(--edge);border-radius:999px;padding:3px 11px;font-size:12px}
.c-day[aria-pressed=true]{background:var(--ink);color:var(--canvas);box-shadow:none}
.c-why{font-size:12px;color:var(--gry);line-height:1.55;margin:0}
.c-imp{margin:0;background:var(--card);box-shadow:var(--edge);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.6}
.c-imp small{display:block;color:var(--dim);font-size:12px;margin-top:3px}
.c-imp.back{box-shadow:inset 3px 0 0 var(--gry),var(--edge)}
.c-go{display:flex;justify-content:flex-end;gap:6px}
.empty-n{padding:12px;font-size:12.5px;color:var(--dim);line-height:1.6}

/* ---------- 提示 ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,12px);background:var(--toast-bg);color:var(--toast-ink);border-radius:12px;padding:11px 18px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:20;box-shadow:0 16px 40px -18px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *{transition:none}
  .cell.flash{animation:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="主导航">
    <div class="logo"><span class="logo-mark">RN</span>RN Bundle</div>
    <button type="button" class="app-sw"><span class="app-av">米</span><span class="app-n">小米汽车<span class="app-k">MiCar</span></span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg></button>
    <a class="nav-a on" href="#" aria-current="page"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>线上现状</a>
    <a class="nav-a" href="#"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>构建<span class="nav-n">128</span></a>
    <a class="nav-a" href="#"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m16 12-4-4-4 4"/><path d="M12 16V8"/></svg>发布记录<span class="nav-n">32</span></a>
    <a class="nav-a" href="#"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>模块<span class="nav-n">46</span></a>
    <a class="nav-a" href="#"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18h2"/></svg>应用</a>
    <div class="nav-g">平台</div>
    <a class="nav-a" href="#"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="5.5" r="2.5"/><circle cx="18" cy="5.5" r="2.5"/><circle cx="12" cy="18.5" r="2.5"/><path d="M6 8v1a3 3 0 0 0 3 3h6a3 3 0 0 0 3-3V8"/><path d="M12 12v4"/></svg>代码源</a>
    <a class="nav-a" href="#"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>构建适配器</a>
    <a class="nav-a" href="#"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.66 3.58 3 8 3s8-1.34 8-3v-13"/><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/></svg>存储</a>
    <a class="nav-a" href="#"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg>环境</a>
    <a class="nav-a" href="#"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4.5"/><path d="m11.2 11.8 8.3-8.3"/><path d="m16 7 2.5 2.5"/></svg>访问令牌</a>
    <div class="side-ft">
      <div class="me"><span class="av">张</span><span><span class="me-n">张伟</span><span class="me-r">SuperAdmin</span></span></div>
      <div class="theme" role="group" aria-label="外观" id="theme"><button type="button" class="th-b" data-th="light" aria-pressed="false" title="浅色"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg></button><button type="button" class="th-b" data-th="dark" aria-pressed="false" title="深色"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a6.6 6.6 0 0 0 9.7 9.7z"/></svg></button><button type="button" class="th-b" data-th="system" aria-pressed="true" title="跟随系统"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="3.5" width="19" height="13" rx="2"/><path d="M8 20.5h8M12 16.5v4"/></svg></button></div>
    </div>

  <main class="main canvas">
    <header class="hd">
      <div>
        <h1 class="ttl">线上现状</h1>
        <p class="sub" id="summary"></p>

      <div class="tools">
        <span class="tool-l">运行时版本</span>
        <div class="seg" role="group" aria-label="运行时版本" id="rv">
          <button type="button" class="seg-b" data-rv="725" aria-pressed="true">725</button>
          <button type="button" class="seg-b" data-rv="610" aria-pressed="false">610</button>

        <span class="search"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>搜索<span class="kbd">⌘K</span></span>
        <button type="button" class="btn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>新建构建</button>
      </div>
    </header>

    <section class="need" aria-labelledby="need-t">
      <div class="sec-h"><h2 class="sec-t" id="need-t">需要处理</h2><span class="sec-s" id="need-s"></span></div>
      <div id="need"></div>
    </section>

    <section class="mx" aria-label="模块与环境">
      <div id="grid"></div>
      <div class="legend">
        <span><i class="lg-i" style="background:var(--acc)"></i>全量</span>
        <span><i class="lg-i" style="background:var(--gry)"></i>比例灰度</span>
        <span><i class="lg-i" style="background:var(--pin)"></i>定向灰度</span>
        <span class="legend-r">方向键切换格子，Esc 收起发布面板</span>
      </div>
    </section>
  </main>

  <aside class="insp canvas" id="insp" aria-label="所选路由"></aside>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

/* ---------- 数据 ---------- */
const ENVS = [
  { k: "test", l: "测试", c: "var(--e-test)" },
  { k: "staging", l: "预发", c: "var(--e-stg)" },
  { k: "prod", l: "生产", c: "var(--e-prod)" },
];
const MODS = [
  { n: "car-common", k: "通用", repo: "micar/rn-common", br: "main" },
  { n: "car-home", k: "功能", repo: "micar/rn-home", br: "release/2.9" },
  { n: "car-shop", k: "功能", repo: "micar/rn-shop", br: "main" },
  { n: "car-charging", k: "功能", repo: "micar/rn-charging", br: "main" },
  { n: "car-service", k: "功能", repo: "micar/rn-service", br: "main" },
];
const COMMITS = [
  "feat: 首页车况卡片支持 HarmonyOS",
  "fix: 充电桩列表在 iOS 17 下滚动卡顿",
  "feat: 预约保养入口改为底部弹层",
  "chore: 升级 react-native-reanimated 到 3.16",
  "fix: 优惠券过期时间时区错误",
  "feat: 车辆位置分享增加有效期",
  "perf: 首屏 bundle 拆分，减少 320 KB",
  "fix: 登录态失效后未跳转登录页",
  "feat: 订单详情展示交付进度",
  "fix: 安卓返回键关闭弹层后页面空白",
];
const AUTHORS = ["张伟", "李静", "王强", "陈晨"];
const ME = "张伟";

const B = (n, at, st = "ok", rv = "725") => ({ n, at, st, rv });
const BUILDS = {
  "car-common": {
    test: [B(4223, "20 分钟前"), B(4210, "2 小时前"), B(4196, "3 天前")],
    staging: [B(4211, "昨天"), B(4197, "4 天前")],
    prod: [B(4213, "1 小时前"), B(4188, "6 天前"), B(4160, "20 天前", "ok", "610")],
  },
  "car-home": {
    test: [B(4218, "40 分钟前"), B(4202, "2 天前")],
    staging: [B(4217, "35 分钟前"), B(4203, "2 天前")],
    prod: [B(4221, "进行中", "run"), B(4219, "10:24"), B(4215, "昨天"), B(4201, "3 天前"), B(4196, "5 天前"), B(4185, "9 天前", "ok", "610")],
  },
  "car-shop": {
    test: [B(4214, "1 小时前"), B(4206, "2 天前")],
    staging: [B(4222, "15 分钟前"), B(4212, "昨天"), B(4207, "3 天前")],
    prod: [B(4209, "2 天前"), B(4190, "5 天前")],
  },
  "car-charging": {
    test: [B(4220, "50 分钟前")],
    staging: [B(4205, "2 天前")],
    prod: [B(4208, "昨天"), B(4204, "2 天前")],
  },
  "car-service": {
    test: [B(4216, "09:52", "err"), B(4200, "昨天")],
    staging: [B(4199, "昨天")],
    prod: [B(4198, "昨天"), B(4170, "12 天前")],
  },
};
const R = (b, at, by) => ({ b, at, by });
const ROUTES = {
  725: {
    "car-common": { test: { full: R(4210, "2 小时前", "王强") }, staging: { full: R(4211, "昨天", "王强") }, prod: { full: R(4188, "6 天前", "王强") } },
    "car-home": {
      test: { full: R(4218, "40 分钟前", "张伟") },
      staging: { full: R(4217, "35 分钟前", "张伟") },
      prod: { full: R(4201, "3 天前", "王强"), pct: { b: 4215, p: 20, at: "昨天", by: "李静" }, pins: [{ b: 4219, id: "qa-zhangwei", exp: "明天过期", by: "王强" }] },
    },
    "car-shop": { test: { full: R(4214, "1 小时前", "李静") }, staging: { full: R(4212, "昨天", "李静") }, prod: { full: R(4190, "5 天前", "李静") } },
    "car-charging": { test: { full: R(4220, "50 分钟前", "陈晨") }, staging: { full: R(4205, "2 天前", "陈晨") }, prod: { full: R(4204, "2 天前", "陈晨") } },
    "car-service": { test: { full: R(4200, "昨天", "陈晨") }, prod: { full: R(4170, "12 天前", "陈晨") } },
  },
  610: {
    "car-common": { prod: { full: R(4160, "20 天前", "王强") } },
    "car-home": { prod: { full: R(4185, "9 天前", "王强") } },
  },
};

const S = {
  rv: "725",
  sel: ["car-home", "prod"],
  comp: null,
  adj: null,
  need: [
    { id: "fail", ic: "err", sym: "alert", t: "car-service #4216 构建失败", m: "测试环境 · fix/login · 打包阶段退出", go: ["car-service", "test"], acts: [["查看日志", "log"], ["重新构建", "rebuild"]] },
    { id: "pin", ic: "gry", sym: "clock", t: "car-home 定向灰度明天过期", m: "生产 · #4219 · qa-zhangwei", go: ["car-home", "prod"], acts: [["查看", "goto"], ["手动失效", "unpin"]] },
    { id: "cred", ic: "plat", sym: "key", t: "GitLab 凭证 9 天后过期", m: "影响 12 个模块拉取代码", acts: [["更新凭证", "cred"]] },
  ],
  seq: 4227,
};

/* ---------- 工具 ---------- */
const icon = (p) => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const NEED_ICON = {
  alert: icon('<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16.2v.3"/>'),
  clock: icon('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  key: icon('<circle cx="8" cy="15" r="4.5"/><path d="m11.2 11.8 8.3-8.3"/><path d="m16 7 2.5 2.5"/>'),
};
const envOf = (k) => ENVS.find((e) => e.k === k);
const modOf = (n) => MODS.find((m) => m.n === n);
const shaOf = (n) => ((n * 2654435761) >>> 0).toString(16).padStart(8, "0").slice(0, 7);
const commitsBetween = (a, b) => Math.max(1, Math.round(Math.abs(a - b) * 0.9));
const routeOf = (m, e) => {
  const byMod = ROUTES[S.rv][m];
  const r = byMod ? byMod[e] : null;
  return r ? { full: r.full || null, pct: r.pct || null, pins: r.pins || [] } : null;
};
const ensureRoute = (m, e) => {
  ROUTES[S.rv][m] = ROUTES[S.rv][m] || {};
  ROUTES[S.rv][m][e] = ROUTES[S.rv][m][e] || {};
  const r = ROUTES[S.rv][m][e];
  r.pins = r.pins || [];
  return r;
};
const buildsOf = (m, e) => BUILDS[m][e].filter((b) => b.rv === S.rv);
const usedBy = (r, n) => {
  if (!r) return [];
  const out = [];
  if (r.full && r.full.b === n) out.push(["f", "全量"]);
  if (r.pct && r.pct.b === n) out.push(["g", `比例 ${r.pct.p}%`]);
  r.pins.filter((p) => p.b === n).forEach((p) => {
    out.push(["p", `定向 ${p.id}`]);
  });
  return out;
};
const newerCount = (m, e) => {
  const r = routeOf(m, e);
  const base = r?.full ? r.full.b : 0;
  return buildsOf(m, e).filter((b) => b.st === "ok" && b.n > base && usedBy(r, b.n).length === 0).length;
};
const runningOf = (m, e) => buildsOf(m, e).find((b) => b.st === "run");

function toast(text) {
  const t = $("#toast");
  t.textContent = text;
  t.classList.add("on");
  clearTimeout(t.timer);
  t.timer = setTimeout(() => {
    t.classList.remove("on");
  }, 2600);
}

/* ---------- 摘要 ---------- */
function renderSummary() {
  let pct = 0;
  let pin = 0;
  let newer = 0;
  for (const m of MODS) {
    for (const e of ENVS) {
      const r = routeOf(m.n, e.k);
      if (r && e.k === "prod") {
        if (r.pct) pct += 1;
        pin += r.pins.length;
      }
      if (newerCount(m.n, e.k)) newer += 1;
    }
  }
  const gray = pct || pin ? `生产有 ${pct} 条比例灰度、${pin} 条定向灰度` : "生产没有灰度";
  $("#summary").textContent = `${MODS.length} 个模块 · ${gray} · ${newer} 个格子有新构建可发布`;
}

/* ---------- 需要处理 ---------- */
function renderNeed() {
  $("#need-s").textContent = S.need.length ? `${S.need.length} 项` : "";
  if (!S.need.length) {
    $("#need").innerHTML = `<div class="need-empty">没有需要处理的事。构建失败、灰度即将过期、凭证即将过期都会出现在这里。</div>`;
    return;
  }
  const cards = S.need
    .map((it) => {
      const acts = it.acts.map(([l, a]) => `<button type="button" class="btn sm" data-need="${it.id}" data-act="${a}">${l}</button>`).join("");
      const top = `<span class="need-ic ${it.ic}">${NEED_ICON[it.sym]}</span><span><div class="need-t">${it.t}</div><div class="need-m">${it.m}</div></span>`;
      const head = it.go ? `<button type="button" class="need-top" data-need="${it.id}" data-act="goto">${top}</button>` : `<div class="need-top">${top}</div>`;
      return `<article class="need-c">${head}<div class="need-a">${acts}</div></article>`;
    })
    .join("");
  $("#need").innerHTML = `<div class="need-l">${cards}</div>`;
}

/* ---------- 矩阵 ---------- */
function cellHtml(m, e) {
  const r = routeOf(m.n, e.k);
  const on = S.sel[0] === m.n && S.sel[1] === e.k ? " sel" : "";
  const label = `${m.n} ${e.l}`;
  const run = runningOf(m.n, e.k);
  const newer = newerCount(m.n, e.k);
  const ft = [];
  if (newer) ft.push(`<span class="new">${newer} 个新构建可发布</span>`);
  if (run) ft.push(`<span class="running">#${run.n} 构建中</span>`);
  const foot = ft.length ? `<div class="cell-ft">${ft.join("")}</div>` : "";
  if (!r || (!r.full && !r.pct && !r.pins.length)) {
    const hint = buildsOf(m.n, e.k).some((b) => b.st === "ok") ? "未发布 · 有可发布的构建" : "未发布";
    return `<button type="button" class="cell empty${on}" data-m="${m.n}" data-e="${e.k}" aria-label="${label} 未发布">${hint}</button>`;
  }
  let h = `<button type="button" class="cell${on}" data-m="${m.n}" data-e="${e.k}" aria-label="${label}">`;
  if (r.full) h += `<div class="lane"><span class="lane-b">#${r.full.b}</span><span class="lane-t">全量</span><span class="lane-a">${r.full.at}</span></div>`;
  else h += `<div class="lane"><span class="lane-t">没有全量</span></div>`;
  if (r.pct) {
    h += `<div class="split"><i class="split-i" style="width:${100 - r.pct.p}%"></i><i class="split-i g" style="width:${r.pct.p}%"></i></div>`;
    h += `<div class="lane"><span class="lane-b">#${r.pct.b}</span><span class="lane-t g">比例 ${r.pct.p}%</span></div>`;
  }
  r.pins.forEach((p) => {
    h += `<div class="lane"><span class="lane-b">#${p.b}</span><span class="lane-t p">定向 ${p.id}</span></div>`;
  });
  return `${h}${foot}</button>`;
}

function renderGrid() {
  let h = `<div class="cols mx-h"><div class="gh">模块</div>`;
  h += ENVS.map((e) => `<div class="gh"><i class="dot" style="background:${e.c}"></i>${e.l}</div>`).join("");
  h += `</div>`;
  for (const m of MODS) {
    h += `<div class="mrow cols"><div class="mod"><span class="mod-n">${m.n}</span><span class="mod-k">${m.k}</span><p class="mod-r">${m.repo}</p></div>`;
    h += ENVS.map((e) => cellHtml(m, e)).join("");
    h += `</div>`;
  }
  $("#grid").innerHTML = h;
}

/* ---------- 检查器 ---------- */
function routesHtml(r, _m) {
  if (!r || (!r.full && !r.pct && !r.pins.length)) {
    return `<div class="box"><div class="empty-n">这个环境在运行时版本 ${S.rv} 下还没有发布过。从下面选一个构建开始。</div></div>`;
  }
  let h = `<p class="i-note">先看定向标识，再按用户 ID 分流比例灰度，其余请求走全量。</p><div class="box">`;
  if (r.pct) h += `<div class="i-split"><i class="split-i" style="width:${100 - r.pct.p}%"></i><i class="split-i g" style="width:${r.pct.p}%"></i></div>`;
  let ord = 0;
  r.pins.forEach((p) => {
    ord += 1;
    h += `<div class="rt"><div class="rt-top"><span class="rt-ord">${ord}</span><span class="tag p">定向</span><span class="rt-b">#${p.b}</span><span class="rt-m">${p.id}<br>${p.exp} · ${p.by}</span></div><div class="rt-act"><button type="button" class="btn sm" data-act="unpin" data-id="${p.id}">手动失效</button></div></div>`;
  });
  if (r.pct) {
    ord += 1;
    const v = S.adj === null ? r.pct.p : S.adj;
    let hint = "拖动后点更新才会生效";
    if (v >= 100) hint = "调到 100% 会转为全量";
    else if (v === 0) hint = "调到 0% 等于暂停这条灰度";
    h += `<div class="rt"><div class="rt-top"><span class="rt-ord">${ord}</span><span class="tag g">比例 ${r.pct.p}%</span><span class="rt-b">#${r.pct.b}</span><span class="rt-m">${r.pct.at} · ${r.pct.by}</span></div><div class="adj"><div class="adj-r"><input type="range" min="0" max="100" value="${v}" id="adj" aria-label="灰度比例"><b class="adj-v num" id="adj-v">${v}%</b></div><div class="adj-n"><span id="adj-n">${hint}</span><button type="button" class="btn sm" data-act="adj" ${v === r.pct.p ? "disabled" : ""}>更新比例</button></div></div></div>`;
  }
  ord += 1;
  h += r.full
    ? `<div class="rt"><div class="rt-top"><span class="rt-ord">${ord}</span><span class="tag f">全量</span><span class="rt-b">#${r.full.b}</span><span class="rt-m">${r.full.at} · ${r.full.by}</span></div></div>`
    : `<div class="rt"><div class="rt-top"><span class="rt-ord">${ord}</span><span class="tag n">全量</span><span class="rt-m">还没有全量构建</span></div></div>`;
  return `${h}</div>`;
}

function compHtml(_m, e, r, b) {
  const c = S.comp;
  const full = r ? r.full : null;
  const back = c.mode === "back";
  const n = full ? commitsBetween(b.n, full.b) : 12;
  const shown = Math.min(3, n);
  const list = Array.from({ length: shown }, (_, i) => {
    const k = back ? full.b - i : b.n - i;
    return `<li class="cm-i${back ? " rm" : ""}"><span class="cm-sha">${shaOf(k)}</span><span>${COMMITS[k % COMMITS.length]}</span><span class="cm-by">${AUTHORS[k % AUTHORS.length]}</span></li>`;
  }).join("");
  const range = full ? `${shaOf(Math.min(b.n, full.b))}...${shaOf(Math.max(b.n, full.b))}` : shaOf(b.n);
  const intro = full
    ? `${back ? "回退会撤掉" : "比当前全量多"} ${n} 次提交`
    : `这是${e.l}的第一次发布，共 ${n} 次提交`;
  let h = `<div class="comp"><div class="cm-more"><span>${intro}</span><a class="cm-link" href="#" data-act="compare">在 GitLab 对比 ${range}</a></div><ul class="cm-l">${list}</ul>`;
  if (n > shown) h += `<div class="cm-more"><span>还有 ${n - shown} 次提交</span></div>`;

  if (!back) {
    const pctBlocked = r?.pct && r.pct.b !== b.n;
    const pinSame = r?.pins.some((p) => p.id === "qa-zhangwei" && p.b === b.n);
    const kinds = [
      ["full", "全量", false],
      ["pct", "比例灰度", Boolean(pctBlocked) || Boolean(r?.pct && r.pct.b === b.n)],
      ["pin", "定向灰度", Boolean(pinSame)],
    ];
    const segs = kinds
      .map(([k, l, dis]) => `<button type="button" class="seg-b" data-kind="${k}" aria-pressed="${c.kind === k}" ${dis ? "disabled" : ""}>${l}</button>`)
      .join("");
    h += `<div class="c-row"><span class="c-lb">方式</span><div class="seg">${segs}</div></div>`;
    if (pctBlocked) h += `<p class="c-why">已有比例灰度 #${r.pct.b}（${r.pct.p}%），同一时间只能有一条。要换构建，先在上方把它调到 100% 转为全量。</p>`;
    if (pinSame) h += `<p class="c-why">#${b.n} 已经是 qa-zhangwei 的定向构建。</p>`;
    if (c.kind === "pct") {
      h += `<div class="c-fld"><label for="c-p">比例</label><input type="range" id="c-p" min="1" max="99" value="${c.p}"><b class="c-v num" id="c-pv">${c.p}%</b></div>`;
    } else if (c.kind === "pin") {
      const days = [7, 15, 30].map((d) => `<button type="button" class="c-day" data-day="${d}" aria-pressed="${c.days === d}">${d} 天</button>`).join("");
      h += `<div class="c-fld"><span>标识</span><span class="c-id">qa-zhangwei</span>${days}</div>`;
    }
  }
  h += `<p class="c-imp${back ? " back" : ""}" id="c-imp">${impactText(e, r, b)}</p>`;
  const goLabel = back ? `回退到 #${b.n}` : { full: "发布全量", pct: "开始比例灰度", pin: "开始定向灰度" }[c.kind];
  h += `<div class="c-go"><button type="button" class="btn sm ghost" data-act="cancel">取消</button><button type="button" class="btn sm pri" data-act="confirm">${goLabel}</button></div></div>`;
  return h;
}

function impactText(e, r, b) {
  const c = S.comp;
  const full = r ? r.full : null;
  const cur = full ? `#${full.b}` : "空路由";
  const grays = [];
  if (r?.pct) grays.push(`比例灰度 #${r.pct.b}`);
  if (r?.pins.length) grays.push(`定向 ${r.pins.map((p) => p.id).join("、")}`);
  const keep = grays.length ? `<small>${grays.join("、")} 不受影响，命中它们的请求仍拿到灰度构建。</small>` : "";
  if (c.mode === "back") return `${e.l}的全量从 ${cur} 回退到 #${b.n}。${keep}`;
  if (c.kind === "full") return `${e.l}的全量从 ${cur} 换成 #${b.n}。${keep}`;
  if (c.kind === "pct") return `按用户 ID 分流，${c.p}% 的用户拿到 #${b.n}，其余继续用 ${cur}。<small>之后可以随时调整比例，调到 100% 即转为全量。</small>`;
  const same = r ? r.pins.find((p) => p.id === "qa-zhangwei") : null;
  const replace = same ? `<small>会替换 qa-zhangwei 当前的定向构建 #${same.b}。</small>` : "<small>其他请求不受影响。</small>";
  return `只有标识为 qa-zhangwei 的请求拿到 #${b.n}，${c.days} 天后自动失效。${replace}`;
}

function candsHtml(m, e, r) {
  const list = buildsOf(m.n, e.k);
  if (!list.length) return `<div class="empty-n">运行时版本 ${S.rv} 下还没有${e.l}环境的构建。</div>`;
  const full = r ? r.full : null;
  let firstNew = true;
  return list
    .map((b) => {
      const used = usedBy(r, b.n);
      const open = S.comp && S.comp.n === b.n;
      let delta = "";
      if (full && b.st === "ok" && b.n !== full.b) {
        const k = commitsBetween(b.n, full.b);
        delta = b.n > full.b ? `<span class="cand-d up">+${k} 次提交</span>` : `<span class="cand-d down">早 ${k} 次提交</span>`;
      }
      const tags = used.map(([t, l]) => `<span class="tag ${t}">${l}</span>`).join("");
      let act = "";
      if (b.st === "run") act = `<span class="tag run">构建中</span>`;
      else if (b.st === "err") act = `<span class="tag err">失败</span>`;
      else if (full && b.n === full.b) act = `<span class="cand-st">当前全量</span>`;
      else if (!full || b.n > full.b) {
        act = `<button type="button" class="btn sm${firstNew && !open ? " pri" : ""}" data-act="open" data-n="${b.n}" data-mode="rel">${open ? "收起" : "发布"}</button>`;
        firstNew = false;
      } else act = `<button type="button" class="btn sm" data-act="open" data-n="${b.n}" data-mode="back">${open ? "收起" : "回退到此"}</button>`;
      const meta = `${modOf(m.n).br} · ${shaOf(b.n)} · ${b.at}`;
      const comp = open ? compHtml(m, e, r, b) : "";
      return `<div class="cand${open ? " open" : ""}"><div class="cand-r"><span class="cand-a"><span class="cand-b">#${b.n}</span>${delta}${tags}</span><span class="cand-m">${meta}</span><span class="cand-act">${act}</span></div>${comp}</div>`;
    })
    .join("");
}

function renderInsp() {
  const m = modOf(S.sel[0]);
  const e = envOf(S.sel[1]);
  const r = routeOf(m.n, e.k);
  const builds = buildsOf(m.n, e.k).length;
  $("#insp").innerHTML = `<div class="i-env"><i class="dot" style="background:${e.c}"></i>${e.l}环境 · ${e.k}</div><h2 class="i-ttl">${m.n}</h2><p class="i-sub">${m.repo} · 运行时版本 ${S.rv}</p><section class="i-sec"><h3 class="i-h">当前路由<span class="i-hs">按匹配顺序</span></h3>${routesHtml(r, m)}</section><section class="i-sec"><h3 class="i-h">${e.l}环境的构建<span class="i-hs">${builds} 个 · 只能发布到构建所在环境</span></h3><div class="box">${candsHtml(m, e, r)}</div></section>`;
  bindInsp(r);
}

function bindInsp(r) {
  const adj = $("#adj");
  if (adj) {
    adj.addEventListener("input", () => {
      S.adj = Number(adj.value);
      $("#adj-v").textContent = `${S.adj}%`;
      let hint = "拖动后点更新才会生效";
      if (S.adj >= 100) hint = "调到 100% 会转为全量";
      else if (S.adj === 0) hint = "调到 0% 等于暂停这条灰度";
      $("#adj-n").textContent = hint;
      $('[data-act="adj"]').disabled = S.adj === r.pct.p;
      const bars = $$("#insp .i-split .split-i");
      bars[0].style.width = `${100 - S.adj}%`;
      bars[1].style.width = `${S.adj}%`;
    });
  }
  const cp = $("#c-p");
  if (cp) {
    cp.addEventListener("input", () => {
      S.comp.p = Number(cp.value);
      $("#c-pv").textContent = `${S.comp.p}%`;
      const m = modOf(S.sel[0]);
      const e = envOf(S.sel[1]);
      const b = buildsOf(m.n, e.k).find((x) => x.n === S.comp.n);
      $("#c-imp").innerHTML = impactText(e, routeOf(m.n, e.k), b);
    });
  }
}

function render() {
  renderSummary();
  renderNeed();
  renderGrid();
  renderInsp();
}

function flash(m, e) {
  const el = $(`.cell[data-m="${m}"][data-e="${e}"]`);
  if (!el) return;
  el.classList.remove("flash");
  void el.offsetWidth;
  el.classList.add("flash");
}

function select(m, e) {
  if (S.sel[0] !== m || S.sel[1] !== e) {
    S.comp = null;
    S.adj = null;
  }
  S.sel = [m, e];
  render();
}

/* ---------- 动作 ---------- */
function confirmRelease() {
  const [m, ek] = S.sel;
  const e = envOf(ek);
  const c = S.comp;
  const r = ensureRoute(m, ek);
  let msg = "";
  if (c.mode === "back" || c.kind === "full") {
    r.full = R(c.n, "刚刚", ME);
    msg = c.mode === "back" ? `已回退：${m} ${e.l}全量回到 #${c.n}` : `已发布：${m} ${e.l}全量换成 #${c.n}`;
  } else if (c.kind === "pct") {
    r.pct = { b: c.n, p: c.p, at: "刚刚", by: ME };
    msg = `已开始比例灰度：${m} ${e.l} #${c.n}，${c.p}%`;
  } else {
    r.pins = r.pins.filter((p) => p.id !== "qa-zhangwei");
    r.pins.push({ b: c.n, id: "qa-zhangwei", exp: `${c.days} 天后过期`, by: ME });
    msg = `已开始定向灰度：qa-zhangwei 拿到 #${c.n}，${c.days} 天后失效`;
  }
  S.comp = null;
  render();
  flash(m, ek);
  toast(msg);
}

function unpin(m, ek, id) {
  const r = ensureRoute(m, ek);
  r.pins = r.pins.filter((p) => p.id !== id);
  if (m === "car-home" && ek === "prod") S.need = S.need.filter((x) => x.id !== "pin");
  render();
  flash(m, ek);
  toast(`定向灰度 ${id} 已失效，这些请求回到比例灰度或全量`);
}

function applyAdj() {
  const [m, ek] = S.sel;
  const r = ensureRoute(m, ek);
  const v = S.adj;
  if (v >= 100) {
    r.full = R(r.pct.b, "刚刚", ME);
    toast(`比例灰度 #${r.pct.b} 已转为全量`);
    r.pct = null;
  } else {
    r.pct.p = v;
    r.pct.at = "刚刚";
    r.pct.by = ME;
    toast(`灰度比例已更新为 ${v}%`);
  }
  S.adj = null;
  render();
  flash(m, ek);
}

function needAction(id, act) {
  const it = S.need.find((x) => x.id === id);
  if (act === "goto" && it.go) {
    select(it.go[0], it.go[1]);
    return;
  }
  if (act === "log") {
    toast("将打开构建 #4216 的日志");
    return;
  }
  if (act === "cred") {
    toast("将打开代码源设置，更新 GitLab Access Token");
    return;
  }
  if (act === "rebuild") {
    S.seq += 1;
    BUILDS["car-service"].test.unshift(B(S.seq, "刚刚", "run"));
    S.need = S.need.filter((x) => x.id !== "fail");
    select("car-service", "test");
    toast(`已触发构建 #${S.seq}：car-service · fix/login · 测试环境`);
    return;
  }
  if (act === "unpin") unpin("car-home", "prod", "qa-zhangwei");
}

/* ---------- 事件 ---------- */
$("#grid").addEventListener("click", (ev) => {
  const c = ev.target.closest(".cell");
  if (c) select(c.dataset.m, c.dataset.e);
});
$("#need").addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-need]");
  if (b) needAction(b.dataset.need, b.dataset.act);
});
$("#insp").addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-act],[data-kind],[data-day]");
  if (!t) return;
  if (t.dataset.kind) {
    S.comp.kind = t.dataset.kind;
    renderInsp();
    return;
  }
  if (t.dataset.day) {
    S.comp.days = Number(t.dataset.day);
    renderInsp();
    return;
  }
  const act = t.dataset.act;
  if (act === "compare") {
    ev.preventDefault();
    toast("将在 GitLab 打开两个构建之间的提交对比");
  } else if (act === "open") {
    const n = Number(t.dataset.n);
    S.comp = S.comp && S.comp.n === n ? null : { n, mode: t.dataset.mode, kind: "full", p: 10, days: 7 };
    renderInsp();
  } else if (act === "cancel") {
    S.comp = null;
    renderInsp();
  } else if (act === "confirm") {
    confirmRelease();
  } else if (act === "unpin") {
    unpin(S.sel[0], S.sel[1], t.dataset.id);
  } else if (act === "adj") {
    applyAdj();
  }
});
$("#rv").addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-rv]");
  if (!b) return;
  S.rv = b.dataset.rv;
  S.comp = null;
  S.adj = null;
  $$("#rv .seg-b").forEach((x) => {
    x.setAttribute("aria-pressed", String(x === b));
  });
  render();
});

const media = matchMedia("(prefers-color-scheme: dark)");
let themePref = "system";
function applyTheme() {
  const t = themePref === "system" ? (media.matches ? "dark" : "light") : themePref;
  document.documentElement.dataset.theme = t;
  $$("#theme .th-b").forEach((x) => {
    x.setAttribute("aria-pressed", String(x.dataset.th === themePref));
  });
}
$("#theme").addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-th]");
  if (!b) return;
  themePref = b.dataset.th;
  applyTheme();
});
media.addEventListener("change", applyTheme);

addEventListener("keydown", (ev) => {
  if (ev.target instanceof HTMLInputElement) return;
  if (ev.key === "Escape" && (S.comp || S.adj !== null)) {
    S.comp = null;
    S.adj = null;
    renderInsp();
    return;
  }
  const moves = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
  const mv = moves[ev.key];
  if (!mv) return;
  ev.preventDefault();
  const mi = MODS.findIndex((m) => m.n === S.sel[0]);
  const ei = ENVS.findIndex((e) => e.k === S.sel[1]);
  const nm = Math.min(MODS.length - 1, Math.max(0, mi + mv[0]));
  const ne = Math.min(ENVS.length - 1, Math.max(0, ei + mv[1]));
  select(MODS[nm].n, ENVS[ne].k);
  $(`.cell[data-m="${MODS[nm].n}"][data-e="${ENVS[ne].k}"]`).focus();
});

applyTheme();
render();
</script>
</body>
</html>
