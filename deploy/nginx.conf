# Forge Console 静态站点。只托管前端文件，/api 等后端路径由负载均衡（Matrix 转发规则 / MIFE）转发给 forge-server，
# 这里不做反向代理。
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/forge-console;

    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Matrix 容器健康检查：HTTP GET /_check_domain_health，端口 80。
    location = /_check_domain_health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # 后端路径落到前端容器说明转发规则没配好，直接返回 404，避免把 index.html 当接口响应返回。
    location ~ ^/(api|healthz|readyz|metrics|openapi\.json)(/|$) {
        return 404;
    }

    # Vite 产物文件名带内容哈希，可以长期缓存。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # React Router 使用 BrowserRouter：未知路径回退到 index.html，由前端路由处理。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
